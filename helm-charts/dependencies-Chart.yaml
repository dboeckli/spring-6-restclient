# the first section is ignored. is replaced by the values from the Chart.yaml
apiVersion: v2
name: test
description: test
type: application
version: 0.0.1
appVersion: 0.0.1

dependencies:
  - name: spring-6-auth-server-chart
    version: "0.0.11-snapshot"
    repository: "oci://registry-1.docker.io/domboeckli"
    condition: authServer.enabled
  - name: spring-6-rest-mvc-mysql-chart
    version: "0.0.4-snapshot"
    repository: "oci://registry-1.docker.io/domboeckli"
    condition: mysql.enabled
  - name: spring-6-rest-mvc-kafka-chart
    version: "0.0.4-snapshot"
    repository: "oci://registry-1.docker.io/domboeckli"
    condition: kafka.enabled
  - name: spring-6-rest-mvc-chart
    version: "0.0.4-snapshot"
    repository: "oci://registry-1.docker.io/domboeckli"
    condition: restMvc.enabled
  - name: spring-6-cold-micro-service-chart
    version: "0.0.1-snapshot"
    repository: "oci://registry-1.docker.io/domboeckli"
    alias: coldMicroService
    condition: coldMicroService.enabled
  - name: spring-6-cool-micro-service-chart
    version: "0.0.1-snapshot"
    repository: "oci://registry-1.docker.io/domboeckli"
    alias: coolMicroService
    condition: coolMicroService.enabled
  - name: spring-6-icecold-micro-service-chart
    version: "0.0.1-snapshot"
    repository: "oci://registry-1.docker.io/domboeckli"
    alias: icecoldMicroService
    condition: icecoldMicroService.enabled
